<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamonaviy Илонча Ўйини</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Юқори қисм: Баллар ва Бошқарув -->
        <header class="game-header">
            <h1>ИЛОНЧА</h1>
            <div class="score-board">
                <div class="score-box">Бал: <span id="current-score">0</span></div>
                <div class="score-box">Рекорд: <span id="best-score">0</span></div>
            </div>
        </header>

        <!-- Ўйин майдони ва Экранолди ҳолатлар -->
        <div class="board-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <!-- Бошланиш ва Ўйин тугади экранлари -->
            <div id="startScreen" class="overlay-screen">
                <h2>Илонча Ўйинига Хуш Келибсиз!</h2>
                <p>Бошлаish учун тугмани босинг</p>
                <button id="startBtn" class="btn primary-btn">Бошлаш</button>
            </div>

            <div id="gameOverScreen" class="overlay-screen hidden">
                <h2>Ўйин Тугади!</h2>
                <p>Сизнинг натижангиз: <span id="finalScore">0</span></p>
                <button id="restartBtn" class="btn primary-btn">Қайтадан Бошлаш</button>
            </div>
        </div>

        <!-- Бошқарув тугмалари -->
        <div class="controls-panel">
            <button id="pauseBtn" class="btn secondary-btn" disabled>Пауза</button>
        </div>

        <!-- Мобил қурилмалар учун экрандаги стрелкалар -->
        <div class="mobile-controls">
            <button class="control-btn" id="upBtn">⬆️</button>
            <div class="middle-controls">
                <button class="control-btn" id="leftBtn">⬅️</button>
                <button class="control-btn" id="rightBtn">➡️</button>
            </div>
            <button class="control-btn" id="downBtn">⬇️️</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
